# CI skeleton — extend with lint, test, docker build on push
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec turbo run build --filter=@family/shared --filter=@family/genealogy-core
      # Full build when modules are implemented:
      # - run: pnpm build
