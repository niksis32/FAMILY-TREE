name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build workspace packages
        run: pnpm exec turbo run build --filter=@family/web^...

      - name: Next.js build (web green gate)
        run: pnpm exec turbo run build --filter=@family/web

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Validate prod compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
