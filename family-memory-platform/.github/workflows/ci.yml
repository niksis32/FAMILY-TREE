name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build workspace packages
        run: pnpm exec turbo run build --filter=@family/web^...

      - name: Next.js build (web green gate)
        run: pnpm exec turbo run build --filter=@family/web

  smoke-block2:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      POSTGRES_DB: ci_family_platform
      POSTGRES_USER: ci_family_user
      POSTGRES_PASSWORD: ci_postgres_password_min16
      MINIO_ROOT_USER: ci_minio_admin
      MINIO_ROOT_PASSWORD: ci_minio_password_min16
      MEILI_MASTER_KEY: ci_meilisearch_master_key_32chars
      JWT_SECRET: ci_jwt_secret_min_32_characters_long
      DATABASE_URL: postgresql://ci_family_user:ci_postgres_password_min16@localhost:5432/ci_family_platform
      MEILI_HOST: http://localhost:7700
      REDIS_URL: redis://localhost:6379
      SMOKE_PASSWORD: Test12345!
      SMOKE_MERGE_EXECUTE: '1'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_family_platform
          POSTGRES_USER: ci_family_user
          POSTGRES_PASSWORD: ci_postgres_password_min16
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_family_user -d ci_family_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci_meilisearch_master_key_32chars
        ports:
          - 7700:7700
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@family/shared --filter=@family/genealogy-core

      - name: Migrate and seed
        working-directory: family-memory-platform
        run: |
          cat > .env <<EOF
          DATABASE_URL=${{ env.DATABASE_URL }}
          MEILI_HOST=${{ env.MEILI_HOST }}
          MEILI_MASTER_KEY=${{ env.MEILI_MASTER_KEY }}
          JWT_SECRET=${{ env.JWT_SECRET }}
          REDIS_URL=${{ env.REDIS_URL }}
          EOF
          pnpm db:generate
          pnpm exec prisma migrate deploy --schema=apps/api/prisma/schema.prisma
          node apps/api/prisma/seed.js

      - name: Build and start API
        working-directory: family-memory-platform
        run: |
          pnpm api:build
          pnpm api:start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/v1/health && break
            sleep 2
          done

      - name: BLOCK 2 smoke (incl. merge execute)
        working-directory: family-memory-platform
        run: bash scripts/smoke-block2.sh

  docker-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ci_family_platform
      POSTGRES_USER: ci_family_user
      POSTGRES_PASSWORD: ci_postgres_password_min16
      MINIO_ROOT_USER: ci_minio_admin
      MINIO_ROOT_PASSWORD: ci_minio_password_min16
      MEILI_MASTER_KEY: ci_meilisearch_master_key_32
      JWT_SECRET: ci_jwt_secret_min_32_characters_long
      NEO4J_PASSWORD: ci_neo4j_password_min16
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Validate prod compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
