# =============================================================================
# Base infrastructure — shared by dev and prod overlays.
# Run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: family_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_platform}
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_user} -d ${POSTGRES_DB:-family_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: family_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: family_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-family_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-family_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: family_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-family_master_key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional graph layer — enable with: docker compose --profile graph up -d
  neo4j:
    image: neo4j:5-community
    container_name: family_neo4j
    restart: unless-stopped
    profiles:
      - graph
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/family_password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # Optional AI layer — enable with: docker compose --profile ai up -d
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: family_ai
    restart: unless-stopped
    profiles:
      - ai
    environment:
      AI_SERVICE_ENABLED: "true"
    expose:
      - "8000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:
  neo4j_data:
