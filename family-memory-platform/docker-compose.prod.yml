# =============================================================================
# Production overlay for VPS deployment (no bind mounts, optimized images).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  postgres:
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    networks:
      - family_internal

  redis:
    restart: always
    networks:
      - family_internal

  minio:
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    networks:
      - family_internal

  meilisearch:
    restart: always
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    networks:
      - family_internal

  neo4j:
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
    networks:
      - family_internal

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: production
    container_name: family_api
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-family-media}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-family-documents}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_SERVICE_URL: http://ai-service:8000
      COMMUNITY_GRAPHQL_ENABLED: "true"
      COMMUNITY_GRAPHQL_FEDERATION_ENABLED: "true"
      COMMUNITY_GRAPHQL_INTROSPECTION: "false"
      COMMUNITY_GRAPHQL_MAX_DEPTH: "6"
      COMMUNITY_GRAPHQL_RATE_LIMIT: "30"
      COMMUNITY_GRAPHQL_SUBGRAPH_NAME: community
      COMMUNITY_POST_COOLDOWN_SEC: "30"
      COMMUNITY_POST_MAX_PER_HOUR: "15"
      COMMUNITY_POST_MAX_PER_GROUP_HOUR: "8"
      COMMUNITY_POST_MAX_PER_DAY: "80"
      COMMUNITY_SPAM_HTTP_POST_LIMIT: "10"
      COMMUNITY_SPAM_HTTP_THREAD_LIMIT: "5"
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - family_internal

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: production
    container_name: family_web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - family_internal

  nginx:
    image: nginx:alpine
    container_name: family_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api
    networks:
      - family_internal
      - family_public

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: family_ai
    restart: always
    profiles:
      - ai
    expose:
      - "8000"
    environment:
      AI_SERVICE_ENABLED: "true"
    networks:
      - family_internal

networks:
  family_internal:
    driver: bridge
  family_public:
    driver: bridge
